# ── SPA fallback 目標（避免 soft-404）──────────────────────────────────────
# 不存在的路徑：無副檔名（SPA 路由）→ 回 /index.html；
# 有副檔名（/robots.txt、/foo.xml、/x.json 這類「檔案」）→ 內部轉到 @notfound 回 404。
# try_files 最後一個參數可用變數，開頭是 @ 時視為 named location。（作法同 mini-taiwan-pulse）
map $uri $spa_fallback {
    default /index.html;
    "~\.[A-Za-z0-9]+$" @notfound;
}

# ── 機場靜態頁（/airports/<icao>/）的大小寫對照 ─────────────────────────────
# airports.map 由 build 時 scripts/seo/generate-airport-pages.ts 產生（每座有頁的機場一行小寫 key，如
# 「rctp rctp;」；map 字串比對不分大小寫，所以大寫也查得到），Dockerfile 複製到 /etc/nginx/。
# 查不到 = 沒有這座機場的頁 → 404。網址契約是小寫，大寫一律 301 到小寫。
map $airport_code $airport_lower {
    default "";
    include /etc/nginx/airports.map;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # robots.txt／llms.txt／sitemap.xml 含中文：text/* 回應帶 charset，避免爬蟲以 Latin-1 解讀
    charset utf-8;

    # .jsonl/.geojson 預設落到 octet-stream（吃不到 gzip_types）→ 補上正確 mime type
    # 注意：server 層宣告 types 會整組取代 http 層繼承，必須連 mime.types 一起 include
    include /etc/nginx/mime.types;
    types {
        application/x-ndjson  jsonl;
        application/geo+json  geojson;
    }

    # /data volume（Zeabur 持久化儲存，優先 serve）
    location /data/ {
        root /;
        expires 1h;
        add_header Cache-Control "public";

        # 檔名帶日期的逐日 shard 內容不可變 → 長效快取
        location ~* "/data/.*/[0-9]{4}-[0-9]{2}-[0-9]{2}\.jsonl$" {
            expires max;
            add_header Cache-Control "public, immutable";
        }
    }

    # 機場靜態頁：放在 SPA fallback 之前；缺頁 404、無結尾斜線與大寫都 301 到正式網址
    location = /airports {
        return 301 /airports/;
    }

    location ^~ /airports/ {
        absolute_redirect off;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;

        location ~ "^/airports/(?<airport_code>[A-Za-z0-9]+)/?$" {
            if ($airport_lower = "") {
                return 404;
            }
            if ($uri != "/airports/$airport_lower/") {
                return 301 /airports/$airport_lower/;
            }
            add_header Cache-Control "no-cache" always;
            try_files /airports/$airport_lower/index.html =404;
        }
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ $spa_fallback;
    }

    location @notfound {
        return 404;
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip（.jsonl/.geojson 靠上方 types 宣告對上 x-ndjson/geo+json，實測可省 ~69% 流量）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml application/x-ndjson application/geo+json;
    gzip_min_length 256;
    gzip_vary on;
}
