services:
  flight-arc:
    build:
      context: .
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    ports:
      - "3721:80"
    volumes:
      # 航班資料是 gitignored 的，從 host 掛載進去
      - ./public/tracks:/usr/share/nginx/html/tracks:ro
      - ./public/airspace:/usr/share/nginx/html/airspace:ro
    restart: unless-stopped
